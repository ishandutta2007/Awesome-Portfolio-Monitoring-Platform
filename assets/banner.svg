<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1a103c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dash 12s linear infinite;
      }
      .float-up {
        animation: float 4s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodeScale 2.5s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes nodeScale {
        0% { r: 5px; opacity: 0.7; }
        100% { r: 8px; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <circle cx="200" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>
  <circle cx="850" cy="120" r="100" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <g class="float-up" transform="translate(740, 80)">
    <rect x="0" y="0" width="380" height="220" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.5" stroke-width="1.5"/>
    
    <line x1="30" y1="50" x2="350" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="30" y1="100" x2="350" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="30" y1="150" x2="350" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="50" y="120" width="18" height="55" rx="4" fill="#6366f1" opacity="0.7"/>
    <rect x="85" y="95" width="18" height="80" rx="4" fill="#6366f1" opacity="0.8"/>
    <rect x="120" y="135" width="18" height="40" rx="4" fill="#6366f1" opacity="0.6"/>
    <rect x="155" y="70" width="18" height="105" rx="4" fill="#8b5cf6" opacity="0.85"/>
    <rect x="190" y="85" width="18" height="90" rx="4" fill="#8b5cf6" opacity="0.8"/>
    <rect x="225" y="55" width="18" height="120" rx="4" fill="#ec4899" opacity="0.9"/>
    <rect x="260" y="40" width="18" height="135" rx="4" fill="#ec4899" opacity="0.95"/>
    <rect x="295" y="30" width="18" height="145" rx="4" fill="#10b981" opacity="1"/>

    <path d="M 59 110 Q 120 120 164 65 T 269 35 T 304 22" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" class="dash-flow" filter="url(#glow)"/>

    <circle cx="59" cy="110" r="5" fill="#10b981" class="node-pulse"/>
    <circle cx="164" cy="65" r="5" fill="#06b6d4" class="node-pulse"/>
    <circle cx="269" cy="35" r="5" fill="#ec4899" class="node-pulse"/>
    <circle cx="304" cy="22" r="6" fill="#10b981" class="node-pulse"/>

    <rect x="240" y="-12" width="120" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="300" y="9" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">▲ +38.4% IRR</text>
  </g>

  <g transform="translate(80, 0)">
    <rect x="0" y="70" width="235" height="30" rx="15" fill="#312e81" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="15" cy="85" r="5" fill="#10b981"/>
    <text x="30" y="90" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>

    <text x="0" y="160" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Portfolio
    </text>
    <text x="0" y="215" fill="url(#accentGrad)" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Monitoring Platform
    </text>

    <text x="0" y="265" fill="#94a3b8" font-family="sans-serif" font-size="17" font-weight="400">
      The definitive directory of SaaS solutions &amp; open-source engines
    </text>
    <text x="0" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="500">
      📊 VC &amp; PE Funds • 💼 KPI Monitoring • 📈 Valuation &amp; LP Reporting • ⚡ Investment Analytics
    </text>

    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="47" y="17" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SaaS Pricing</text>

      <rect x="105" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="157" y="17" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open-Source</text>

      <rect x="220" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="265" y="17" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Free Tiers</text>

      <rect x="320" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="377" y="17" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">AUM &amp; Valuations</text>
    </g>
  </g>
</svg>