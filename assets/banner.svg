<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1a103c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dash 12s linear infinite;
      }
      .float-up {
        animation: float 4s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodeScale 2.5s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes nodeScale {
        0% { r: 5px; opacity: 0.7; }
        100% { r: 8px; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="880" y1="0" x2="880" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1040" y1="0" x2="1040" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="160" cy="180" r="130" fill="#6366f1" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1060" cy="200" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>
  <circle cx="280" cy="260" r="90" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Side: Animated Financial Analytics Graphic Panel (x=60, y=90, width=320, height=220) -->
  <g class="float-up" transform="translate(60, 90)">
    <!-- Glass Panel -->
    <rect x="0" y="0" width="320" height="220" rx="16" fill="#1e293b" fill-opacity="0.65" stroke="#475569" stroke-opacity="0.5" stroke-width="1.5"/>
    
    <!-- Grid Lines -->
    <line x1="25" y1="50" x2="295" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="25" y1="100" x2="295" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="25" y1="150" x2="295" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Bar Chart Elements -->
    <rect x="40" y="120" width="16" height="55" rx="4" fill="#6366f1" opacity="0.75"/>
    <rect x="72" y="95" width="16" height="80" rx="4" fill="#6366f1" opacity="0.85"/>
    <rect x="104" y="130" width="16" height="45" rx="4" fill="#6366f1" opacity="0.7"/>
    <rect x="136" y="75" width="16" height="100" rx="4" fill="#8b5cf6" opacity="0.85"/>
    <rect x="168" y="85" width="16" height="90" rx="4" fill="#8b5cf6" opacity="0.8"/>
    <rect x="200" y="55" width="16" height="120" rx="4" fill="#ec4899" opacity="0.9"/>
    <rect x="232" y="40" width="16" height="135" rx="4" fill="#ec4899" opacity="0.95"/>
    <rect x="264" y="30" width="16" height="145" rx="4" fill="#10b981" opacity="1"/>

    <!-- Trend Line Overlay -->
    <path d="M 48 110 Q 104 125 144 70 T 240 35 T 272 22" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" class="dash-flow" filter="url(#glow)"/>

    <!-- Data Nodes -->
    <circle cx="48" cy="110" r="5" fill="#10b981" class="node-pulse"/>
    <circle cx="144" cy="70" r="5" fill="#06b6d4" class="node-pulse"/>
    <circle cx="240" cy="35" r="5" fill="#ec4899" class="node-pulse"/>
    <circle cx="272" cy="22" r="6" fill="#10b981" class="node-pulse"/>

    <!-- Mini KPI badge -->
    <rect x="180" y="-12" width="125" height="30" rx="15" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.2"/>
    <text x="242" y="8" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">▲ +38.4% IRR</text>
  </g>

  <!-- Right Side: Clean Typography & Information Content (x=430) -->
  <g transform="translate(430, 0)">
    <!-- Header Badge -->
    <rect x="0" y="65" width="225" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="14" cy="79" r="4.5" fill="#10b981"/>
    <text x="28" y="84" fill="#c7d2fe" font-family="sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="148" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Portfolio
    </text>
    <text x="0" y="200" fill="url(#accentGrad)" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Monitoring Platform
    </text>

    <!-- Subtitles -->
    <text x="0" y="248" fill="#94a3b8" font-family="sans-serif" font-size="16.5" font-weight="400">
      The definitive directory of SaaS solutions &amp; open-source engines
    </text>
    <text x="0" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="14.5" font-weight="500">
      📊 VC &amp; PE Funds • 💼 KPI Monitoring • 📈 Valuation &amp; LP Reporting • ⚡ Investment Analytics
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 312)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52" y="17" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SaaS Pricing</text>

      <rect x="115" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="172" y="17" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open-Source</text>

      <rect x="240" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="287" y="17" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Free Tiers</text>

      <rect x="345" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="412" y="17" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">AUM &amp; Valuations</text>
    </g>
  </g>
</svg>